<!doctype html>
<!-- Open Halo 2: development page. Reads game files from ./game on the dev
     server (a junction to the owner's own disc files in the work dir).
     Never published. -->
<html><head><meta charset="utf-8"><title>Open Halo 2 (dev)</title>
<style>body{background:#111;color:#ccc;font:13px monospace;margin:8px}canvas{background:#000;display:block}
#log{white-space:pre-wrap;max-height:40vh;overflow:auto}</style></head>
<body><canvas id="canvas" width="640" height="480"></canvas><div id="log"></div>
<script>
const logEl = document.getElementById('log');
// The log on the page is the last 40 lines, redrawn at most once a frame: the
// runtime prints thousands of lines and a DOM update per line stalls the page.
const tailLines = []; let tailDirty = false;
function say(s) {
  console.log(s);
  tailLines.push(s); if (tailLines.length > 40) tailLines.shift();
  if (!tailDirty) { tailDirty = true; requestAnimationFrame(() => { tailDirty = false; logEl.textContent = tailLines.join('\n'); }); }
}
const q = new URLSearchParams(location.search);
var Module = {
  canvas: document.getElementById('canvas'),
  print: say, printErr: say,
  preRun: [function () {
    // environment switches: ?env=RECOMP_X=1~RECOMP_Y=2  ('~' between them: values hold commas)
    for (const kv of (q.get('env') || '').split('~')) {
      const i = kv.indexOf('='); if (i > 0) ENV[kv.slice(0, i)] = kv.slice(i + 1);
    }
    // ?save=<folder>: this tab's own hard disk in the private file system (two
    // tabs cannot share one: its files are opened for exclusive access)
    if (q.get('save')) ENV.H2_SAVE = '/opfs/' + q.get('save');
    // system link: each tab is its own station, so its own Ethernet address
    if (q.get('link') && !ENV.RECOMP_MAC) {
      const b = crypto.getRandomValues(new Uint8Array(3));
      ENV.RECOMP_MAC = '02:48:32:' + Array.from(b, x => x.toString(16).padStart(2, '0')).join(':');
    }
  }],
  onAbort: function (w) { say('ABORT: ' + w); },
  onRuntimeInitialized: function () { Module.h2ready = true; Module.h2autoplay = !!q.get('autoplay'); },
  // A frame from the WebGL2 backend (nv2a_gl.c): an ImageBitmap made on the
  // executor's own canvas, shown on a second canvas over the first.
  nv2aFrame: function (bmp) {
    let g = Module.nv2aView;
    if (!g) {
      const c = document.createElement('canvas'); c.id = 'glcanvas'; c.width = 640; c.height = 480;
      Module.canvas.replaceWith(c);
      g = Module.nv2aView = c.getContext('bitmaprenderer');
      say('page: first WebGL frame ' + bmp.width + 'x' + bmp.height);
    }
    // a test rig's picture (tools/ol_wdrive.py): a canvas fed ImageBitmaps reads back empty
    if (Module.snapWanted) {
      Module.snapWanted = false;
      const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
      c.getContext('2d').drawImage(bmp, 0, 0);
      Module.snapURL = c.toDataURL('image/png');
    }
    g.transferFromImageBitmap(bmp);
    Module.h2frames = (Module.h2frames || 0) + 1;
  },
};
window.addEventListener('error', e => say('page error: ' + e.message));
window.addEventListener('unhandledrejection', e => say('rejection: ' + e.reason));
</script>
<script>
// ?import=1: copy the files listed in manifest.json (written by tools/webboot.sh
// from the dev tree's game/ and save/ folders) into the origin's private file
// system, skipping files already there with the same size. The program then
// mounts them at /game and /save. ?import=only stops after the copy.
// A packed site (tools/web_pack.py) has manifest.json as {v:2, files, dirs}: a file
// entry is [path, size, pieces, blank]. pieces: URLs fetched in order and joined
// (a host's file size limit; they may lie in a sibling folder of the same origin);
// blank: made at its size and left empty (hard disk images the title formats).
// Such a site imports on every load, without ?import.
async function importTree(man) {
  const packed = !Array.isArray(man);
  const list = packed ? man.files : man;
  const root = await navigator.storage.getDirectory();
  let done = 0, bytes = 0, skipped = 0, failed = 0; const t0 = performance.now();
  const total = list.reduce((a, f) => a + (f[3] ? 0 : f[1]), 0);
  for (const [path, size, pieces, blank] of list) {
    const parts = path.split('/'); const name = parts.pop();
    let dir = root; for (const d of parts) dir = await dir.getDirectoryHandle(d, {create: true});
    const fh = await dir.getFileHandle(name, {create: true});
    // maps are regenerated in place at the same size, so ?import=force copies everything again
    if (q.get('import') !== 'force' && (await fh.getFile()).size === size) { skipped++; continue; }
    const w = await fh.createWritable();   // nothing is kept unless close() is reached
    if (blank) { await w.truncate(size); await w.close(); continue; }
    let ok = true;
    for (const url of (pieces || [encodeURI(path)])) {
      const r = await fetch(url);
      if (!r.ok) { say('import: ' + url + ' -> HTTP ' + r.status); ok = false; break; }
      await r.body.pipeTo(w, {preventClose: true});
      bytes += +r.headers.get('content-length') || 0;
      if (packed) say('download: ' + (bytes / 1048576 | 0) + ' of ' + (total / 1048576 | 0) + ' MB (' + path + ')');
    }
    if (!ok) { await w.abort(); failed++; continue; }
    await w.close();
    done++;
    if (!packed && done % 20 === 0) say('import: ' + done + ' files, ' + (bytes / 1048576 | 0) + ' MB');
  }
  // empty directories of the save tree
  for (const d of (packed ? man.dirs : await (await fetch('manifest_dirs.json')).json())) {
    let dir = root; for (const part of d.split('/')) dir = await dir.getDirectoryHandle(part, {create: true});
  }
  say('IMPORT_DONE copied ' + done + ' files (' + (bytes / 1048576 | 0) + ' MB), ' + skipped + ' already there, '
      + failed + ' failed, ' + ((performance.now() - t0) / 1000 | 0) + ' s');
  if (failed) throw new Error('some game files could not be downloaded; reload the page to try again');
}
async function ensureGame() {
  const byog = await import('./byog.js');
  if (await byog.haveGame()) { say('byog: your game is already imported'); return; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000d;z-index:9';
  box.innerHTML = '<div style="max-width:560px;padding:24px;background:#1b1f24;border:1px solid #445;font:15px sans-serif;color:#dde">'
    + '<h2 style="margin-top:0">Open Halo 2 needs your own copy of Halo 2</h2>'
    + '<p>Choose your original Xbox Halo 2 disc image (a Redump .iso or an XISO), or the folder of a copy you extracted. '
    + 'The files the game needs (about 4.5 GB) are copied into this browser\'s private storage, once. Nothing is uploaded.</p>'
    + '<p><label>Disc image: <input type="file" id="byogIso" accept=".iso,.xiso"></label></p>'
    + '<p><label>Extracted folder: <input type="file" id="byogDir" webkitdirectory></label></p>'
    + '<p id="byogMsg" style="color:#9cf"></p></div>';
  document.body.appendChild(box);
  const msg = box.querySelector('#byogMsg');
  if (navigator.storage.persist) navigator.storage.persist();
  await new Promise((resolve) => {
    const run = async (src) => {
      try {
        msg.textContent = 'reading...';
        await byog.importGame(src, (t) => { msg.textContent = t; say(t); });
        box.remove(); resolve();
      } catch (e) { msg.style.color = '#f99'; msg.textContent = String(e.message || e); }
    };
    box.querySelector('#byogIso').onchange = (e) => e.target.files[0] && run(e.target.files[0]);
    box.querySelector('#byogDir').onchange = (e) => e.target.files.length && run(e.target.files);
  });
}
(async function () {
  try {
    // A static host (GitHub Pages) cannot send the isolation headers threads need:
    // coi-sw.js adds them, and the page reloads once under it.
    const coiTries = +(sessionStorage.getItem('coiReloaded') || 0);
    if (!window.crossOriginIsolated && 'serviceWorker' in navigator && coiTries < 3) {
      const reg = await navigator.serviceWorker.register('coi-sw.js').catch(() => null);
      if (reg) { await navigator.serviceWorker.ready; sessionStorage.setItem('coiReloaded', String(coiTries + 1)); location.reload(); return; }
    }
    let man = null;
    try { man = await (await fetch('manifest.json')).json(); } catch (e) {}
    if (man && (q.get('import') || !Array.isArray(man))) await importTree(man);
    // Bring your own game (a site packed with --byog carries no game files, or ?byog=1):
    // the player's own disc image or extracted folder is copied into the private
    // file system once (byog.js), and checked against the retail default.xbe.
    if ((man && man.byog) || q.get('byog')) await ensureGame();
    if (q.get('ls')) {   // what the private file system holds, seen from the page
      const root = await navigator.storage.getDirectory();
      for await (const [name, h] of root.entries()) {
        let n = 0, bytes = 0, err = '';
        try {
          if (h.kind === 'directory') for await (const [cn, ch] of h.entries()) {
            n++; if (ch.kind === 'file') bytes += (await ch.getFile()).size;
          }
        } catch (e) { err = ' ERROR ' + e.name; }
        say('opfs /' + name + ' ' + h.kind + ' ' + n + ' entries, ' + (bytes / 1048576 | 0) + ' MB in files' + err);
      }
      const est = await navigator.storage.estimate();
      say('opfs usage ' + (est.usage / 1048576 | 0) + ' MB of ' + (est.quota / 1048576 | 0));
      if (q.get('ls') === 'only') return;
    }
    if (q.get('import') === 'only' || q.get('import') === 'force') return;
    if (q.get('clonesave')) {   // ?clonesave=<folder>: a second hard disk, from /save (folders, small files, and big files blank at their size)
      const root = await navigator.storage.getDirectory();
      let files = 0;
      async function copy(from, to) {
        for await (const [name, h] of from.entries()) {
          if (h.kind === 'directory') await copy(h, await to.getDirectoryHandle(name, {create: true}));
          else {
            const f = await h.getFile();
            const w = await (await to.getFileHandle(name, {create: true})).createWritable();
            // a big file (a partition image, a map cache) is made at its size and left blank
            if (f.size > 4 * 1048576) await w.truncate(f.size); else await w.write(await f.arrayBuffer());
            await w.close(); files++;
          }
        }
      }
      await copy(await root.getDirectoryHandle('save'), await root.getDirectoryHandle(q.get('clonesave'), {create: true}));
      say('CLONESAVE_DONE /' + q.get('clonesave') + ': ' + files + ' files');
      if (q.get('clonesave_only')) return;
    }
    // Frames from the WebGL2 backend come straight from its worker as
    // {nv2aFrame: ImageBitmap}; every worker the runtime starts gets a listener.
    // frames shown on the page, every 10 s
    let lastFrames = 0;
    setInterval(() => {
      const n = Module.h2frames || 0;
      say('page: ' + ((n - lastFrames) / 10).toFixed(1) + ' frames a second shown (' + n + ' in all)');
      lastFrames = n;
    }, 10000);
    const RealWorker = window.Worker;
    window.Worker = class extends RealWorker {
      constructor(...a) {
        super(...a);
        this.addEventListener('message', e => { const d = e.data; if (d && d.nv2aFrame) Module.nv2aFrame(d.nv2aFrame); });
      }
    };
    const s = document.createElement('script'); s.src = 'halo2.js'; document.body.appendChild(s);
  } catch (e) { say('start failed: ' + (e && e.stack || e)); }
})();
</script>
<script src="input.js"></script>
<script src="audio.js"></script>
<script src="net.js"></script>
</body></html>
